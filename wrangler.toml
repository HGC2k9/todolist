name = "app"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database Binding ───
[[d1_databases]]
binding = "DB"
database_name = "todo-db"
database_id = "ee9cc188-e5e9-4f79-82e5-06ccb5d0b570"  # Thay bằng ID thật sau khi chạy `wrangler d1 create todo-db`

# ─── Cloudflare Workers AI Binding (Dùng Whisper nhận diện giọng nói) ───
[ai]
binding = "AI"

# ─── Biến môi trường ───
[vars]
COOKIE_NAME = "todo_session"

# Thiết lập Secrets an toàn qua Cloudflare CLI:
# npx wrangler secret put JWT_SECRET

# ─── Cron Triggers: Quét tự động reset việc Hàng ngày/Hàng tuần & dọn dẹp thùng rác ───
[triggers]
crons = ["* * * * *"]
