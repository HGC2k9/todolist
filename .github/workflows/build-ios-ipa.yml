name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          chmod -R +x node_modules/.bin || true

      - name: Build Web Frontend
        run: npm run build

      - name: Capacitor Sync iOS Project
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA (Payload/App.app)
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -vr ToDoList.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoList-Local-Unsigned-IPA
          path: ios/App/build/ToDoList.ipa
          retention-days: 14
