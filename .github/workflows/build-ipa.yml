name: Build iOS Standalone IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build-ios:
    name: Build Standalone IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Standalone Frontend Bundle (HTML, Icons, Vendor Scripts)
        run: npm run build

      - name: Capacitor Sync iOS Project
        run: npx cap sync ios

      - name: Build Xcode Archive (Release)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Standalone IPA (Payload/App.app)
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r ToDoList.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoList-Standalone-IPA
          path: ios/App/build/ToDoList.ipa
          retention-days: 14
